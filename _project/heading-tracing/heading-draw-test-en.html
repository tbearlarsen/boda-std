<button id="replay-btn">replay</button>
<script>
(function () {
  const paths = Array.from(document.querySelectorAll('#Layer-2 path'));
  const lengths = paths.map((p) => p.getTotalLength());
  const totalLength = lengths.reduce((a, b) => a + b, 0);
  const totalDuration = 5200;

  const segs = [];
  let cumulative = 0;
  lengths.forEach((len) => {
    const dur = Math.max((len / totalLength) * totalDuration, 40);
    segs.push({ start: cumulative, dur });
    cumulative += dur;
  });

  function reset() {
    paths.forEach((p, i) => {
      p.style.strokeDasharray = lengths[i];
      p.style.strokeDashoffset = lengths[i];
    });
  }

  function play() {
    reset();
    const start = performance.now();
    function frame(now) {
      const t = now - start;
      paths.forEach((p, i) => {
        const { start: segStart, dur } = segs[i];
        const localT = Math.min(Math.max((t - segStart) / dur, 0), 1);
        p.style.strokeDashoffset = lengths[i] * (1 - localT);
      });
      if (t < cumulative) {
        requestAnimationFrame(frame);
      }
    }
    requestAnimationFrame(frame);
  }

  document.getElementById('replay-btn').addEventListener('click', play);
  play();
})();
</script>
